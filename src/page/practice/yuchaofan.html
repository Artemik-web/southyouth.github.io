<!DOCTYPE html>
<html lang="zh-CN"> <!-- 中文站建议改zh-CN，更规范 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菲兹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
       
        .head {
            width: 100%;
            height: 1200px;
            background-color: rgb(50, 42, 165);
           
            padding-top: 67px; 
        }

        .nav {
            height: 67px;
            background-color: rgb(233, 14, 14);
            position: fixed;
            top: 0; 
            z-index: 9999; 
            left: 160px;
            right: 160px;
            display: flex;
            align-items: center;
            justify-content: space-between; 
            gap: 20px; 
        }

        .logo {
            display: flex;
            align-items: center;
        }
        .logo img {
           
            object-fit: contain;
        }

        .right {
            width: 50%;
            height: 100%; 
            background-color: burlywood;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-right: 10px;
        }

        .right ul {
            list-style: none;
            display: flex;
            gap: 20px; 
           
        }
        .right ul li a {
            color: #000000;
            text-decoration: none;
            cursor: pointer;
        }
       
            .right ul {
                gap: 15px;
            }
            .right ul li a {
                font-size: 16px;
            }
        
    </style>
</head>
<body>
    <div class="head">
        <div class="nav">
            <div class="logo">
                <img src="../public/feizi_img/logo.png" alt="企业logo">
            </div>
            <div class="right">
                <ul>
                    <li><a href="#">关于集团</a></li>
                    <li><a href="#">集团资讯</a></li>
                    <li><a href="#">旗下品牌</a></li>
                    <li><a href="#">人才发展</a></li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
